# The whole application on one machine: ingestion and dashboards.
#
# No credentials, no object storage — backup is opt-in and separate:
#   docker compose -f docker-compose.yml -f docker-compose.litestream.yml up -d
#
# If you want to override any defaults, put a `.env` next to this file.
# Projects live in the database now: after `up -d`, create one with
#   docker compose exec twillingate twillingate project create -alias myapp
# then issue a key with
#   docker compose exec twillingate twillingate key issue -project myapp -label web
#
# The image's default CMD is `serve`, which runs ingestion and — once
# MCP_AUTH_MODE (plus its mode's other variables) is set in `.env` — the
# MCP endpoint too; unconfigured, MCP is skipped with a logged warning.
# See the README's MCP section and docs/mcp-auth.md.
services:
  twillingate:
    image: ghcr.io/dmtrkzntsv/twillingate:${TWILLINGATE_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"          # put Caddy/nginx/Cloudflare in front for TLS
    volumes:
      - data:/var/lib/twillingate
    env_file:
      - path: .env
        required: false
    environment:
      - GOMEMLIMIT=128MiB

  dashboards:
    image: ghcr.io/dmtrkzntsv/twillingate-evidence:${TWILLINGATE_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Read-write on purpose: a SQLite reader in WAL mode needs to write the
    # -shm file, so a :ro mount can fail to open a live database. The process
    # only ever reads, and it renders a private snapshot rather than this file.
    volumes:
      - data:/var/lib/twillingate
    env_file:
      - path: .env
        required: false
    environment:
      - DASHBOARDS_DB_PATH=/var/lib/twillingate/twillingate.db

volumes:
  data:
