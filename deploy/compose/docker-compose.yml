# Tracking: ingestion, the tracker script and — once MCP_AUTH_DSN is set in
# `.env` — the MCP endpoint, all on :8080. See docs/mcp-auth.md.
#
# Dashboards are docker-compose.evidence.yml. To run both, put this in `.env`:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.evidence.yml
#
# Once it is up, create a project and issue a key:
#   docker compose exec twillingate twillingate project create -alias myapp
#   docker compose exec twillingate twillingate key issue -project myapp -label web
services:
  twillingate:
    image: ghcr.io/dmtrkzntsv/twillingate:${TWILLINGATE_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"          # put Caddy/nginx/Cloudflare in front for TLS
    volumes:
      - data:/var/lib/twillingate
    env_file:
      - path: .env
        required: false
    environment:
      - GOMEMLIMIT=128MiB

  # Continuous backup: streams this database to object storage. Needs the R2
  # credentials in `.env` and deploy/litestream/litestream.yml next to this
  # file. Never on at the same time as the `restore` service in
  # docker-compose.evidence.yml. See docs/litestream.md.
  # litestream:
  #   image: litestream/litestream:0.5
  #   restart: unless-stopped
  #   command: ["replicate", "-config", "/etc/litestream.yml"]
  #   volumes:
  #     - ./litestream.yml:/etc/litestream.yml:ro
  #     - data:/var/lib/twillingate
  #   env_file: .env

volumes:
  data:
