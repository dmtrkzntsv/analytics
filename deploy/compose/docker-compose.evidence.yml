# Reporting: the Evidence dashboards, reading the database in the `data` volume.
#
# DASHBOARDS_DB_PATH defaults to the database tracking writes. Point it at
# /data/replica.db instead when a restore is what puts one there.
#
# A brand-new named volume belongs to root and both images run as uid 10001, so
# nothing can write to it. Once, before the first `up`:
#   docker run --rm -v <project>_data:/data alpine chown 10001:10001 /data
# Sharing the volume with the collector needs none of this — it creates
# /var/lib/twillingate owned by 10001 and the volume inherits that.
services:
  dashboards:
    image: ghcr.io/dmtrkzntsv/twillingate-evidence:${TWILLINGATE_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Read-write on purpose: a WAL-mode reader writes the -shm file, so :ro can
    # fail to open the database. The process only ever reads.
    volumes:
      - data:/data
    env_file:
      - path: .env
        required: false
    environment:
      - DASHBOARDS_DB_PATH=${DASHBOARDS_DB_PATH:-/data/twillingate.db}

  # Restores the replica on a loop — an alternative to host cron, and never to
  # be run alongside the collector, which it would restore over. Needs the R2
  # credentials in `.env` and a litestream.yml next to this file.
  #
  # SOURCE_DB is the writer's path, litestream's key for the replica, and must
  # match `path:` in litestream.yml. REPLICA_PATH is where it lands here, and
  # is what DASHBOARDS_DB_PATH must point at. `user` is required: the
  # dashboards cannot open a root-owned replica in WAL mode.
  # restore:
  #   image: litestream/litestream:0.5
  #   restart: unless-stopped
  #   entrypoint: ["/bin/sh", "/restore.sh"]
  #   user: "10001:10001"
  #   volumes:
  #     - ./restore.sh:/restore.sh:ro
  #     - ./litestream.yml:/etc/litestream.yml:ro
  #     - data:/data
  #   env_file: .env
  #   environment:
  #     - SOURCE_DB=/var/lib/twillingate/twillingate.db
  #     - REPLICA_PATH=/data/replica.db
  #     - LOOP_INTERVAL=300

volumes:
  data:
