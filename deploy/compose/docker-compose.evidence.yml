# Dashboards on a machine that only reads a replica — no ingestion here.
#
# Something has to put a database at /data/replica.db in the `data` volume.
# That is deliberately not this application's job: use host cron with
# deploy/litestream/restore.sh, or uncomment the `restore` service below.
# See docs/litestream.md.
services:
  dashboards:
    image: ghcr.io/dmtrkzntsv/analytics-evidence:${ANALYTICS_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - data:/data
    env_file:
      - path: .env
        required: false
    environment:
      - DASHBOARDS_DB_PATH=/data/replica.db

  # In-container alternative to host cron. Needs .env with the R2 credentials
  # and a litestream.yml next to this file.
  # restore:
  #   image: litestream/litestream:0.3.13
  #   restart: unless-stopped
  #   entrypoint: ["/bin/sh", "/restore.sh"]
  #   volumes:
  #     - ./restore.sh:/restore.sh:ro
  #     - ./litestream.yml:/etc/litestream.yml:ro
  #     - data:/data
  #   env_file: .env
  #   environment:
  #     - SOURCE_DB=/var/lib/analytics/analytics.db   # the path on the writer
  #     - REPLICA_PATH=/data/replica.db
  #     - LOOP_INTERVAL=300

volumes:
  data:
