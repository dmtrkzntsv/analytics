name: release
on:
  push:
    branches: [main]
    # A prose-only commit ships no artifact, so it must not burn a version
    # number, a release tag or a QEMU image build. A push that mixes docs
    # with code does not match these patterns exhaustively and still
    # releases, so nothing shippable can slip through unreleased.
    paths-ignore:
      - 'docs/**'
      - '**.md'
permissions:
  contents: write
  packages: write
# Serialize runs so releases are published in commit order.
concurrency:
  group: release
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Full history: changelogithub derives the previous tag from the log to
      # decide which commits the notes cover. A shallow clone sees no earlier
      # tag and would restate the whole history in every release.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: tag
        # vYY.MMDD.{build}: UTC date with the month unpadded (v26.825.N,
        # v26.105.N); the run number makes the tag unique by construction.
        run: echo "tag=v$(date -u +%-y.%-m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make check
      - run: make dist
      # The tag has to exist on the remote before the release points at it.
      - name: tag
        run: |
          git tag "${{ steps.tag.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ steps.tag.outputs.tag }}"
      # changelogithub creates the release, groups the notes by conventional
      # commit type and uploads the artifacts in one call.
      - name: release
        run: >
          npx -y changelogithub@15
          --to "${{ steps.tag.outputs.tag }}"
          --assets "dist/*.tar.gz" --assets dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Published separately from the tarballs: the ingestion image is a static Go
  # binary on alpine, while the Evidence image carries a Node toolchain and
  # compiles sqlite3 from source. A slow or broken dashboards build must not
  # hold up the release of either the binaries or the collector image.
  images:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: analytics
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ needs.release.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/analytics:${{ needs.release.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/analytics:latest
          cache-from: type=gha,scope=analytics
          cache-to: type=gha,mode=max,scope=analytics
      # No linux/arm/v7: sqlite3 publishes no prebuilds for it, and building
      # it from source under QEMU is not worth the release time. A 32-bit
      # host runs the tarball, or renders dashboards elsewhere.
      - name: analytics-evidence
        uses: docker/build-push-action@v6
        with:
          context: .
          target: evidence
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.release.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/analytics-evidence:${{ needs.release.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/analytics-evidence:latest
          cache-from: type=gha,scope=evidence
          cache-to: type=gha,mode=max,scope=evidence
