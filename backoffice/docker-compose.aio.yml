# All-in-one: ingestion + backup + dashboards on one machine.
#   docker compose -f docker-compose.aio.yml up -d
# Put a `.env` next to this file (R2 credentials + any infra overrides) and
# a `projects.json` (copy ../deploy/projects.example.json).
services:
  analytics:
    image: analytics:latest
    build: ..
    restart: unless-stopped
    ports:
      - "8080:8080"          # put Caddy/nginx/Cloudflare in front for TLS
    volumes:
      - ./projects.json:/etc/analytics/projects.json:ro
      - data:/var/lib/analytics
    env_file: .env           # infra overrides (LOG_LEVEL, GEO_URL, …) if any
    environment:
      - GOMEMLIMIT=128MiB

  litestream:
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    command: ["replicate", "-config", "/etc/litestream.yml"]
    volumes:
      - ../deploy/litestream/litestream.yml:/etc/litestream.yml:ro
      - data:/var/lib/analytics
    env_file: .env           # LITESTREAM_* credentials, R2_BUCKET, R2_ENDPOINT

  evidence:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "/entrypoint.sh"]
    ports:
      - "3000:3000"
    volumes:
      - ./evidence:/app
      - ./evidence-entrypoint.sh:/entrypoint.sh:ro
      - data:/data:ro              # reads the LIVE db read-only (WAL readers ok)
    environment:
      - EVIDENCE_SOURCE__analytics__filename=../../../data/analytics.db

  # Split-topology variant of this service (uncomment on a backoffice-only
  # machine, remove `analytics`+`litestream` above, and point Evidence at
  # /data/replica.db):
  # sync:
  #   image: analytics:latest
  #   command: ["sync"]
  #   volumes:
  #     - ./projects.json:/etc/analytics/projects.json:ro
  #     - ../deploy/litestream/litestream.yml:/etc/litestream.yml:ro
  #     - data:/data
  #   env_file: .env
  #   environment:
  #     - SYNC_REPLICA_PATH=/data/replica.db
  #     - SYNC_LITESTREAM_CONFIG=/etc/litestream.yml

volumes:
  data:
