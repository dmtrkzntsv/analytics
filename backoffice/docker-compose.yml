# Backoffice for the split topology: replica sync + dashboards only.
# The VPS runs `analytics serve` + litestream via deploy/install.sh.
#
# Put a `.env` next to this file (LITESTREAM_* credentials, R2_BUCKET,
# R2_ENDPOINT) and a `projects.json` (copy ../deploy/projects.example.json).
services:
  sync:
    image: analytics:latest
    build: ..
    restart: unless-stopped
    command: ["sync"]
    volumes:
      - ./projects.json:/etc/analytics/projects.json:ro
      - ../deploy/litestream/litestream.yml:/etc/litestream.yml:ro
      - data:/data
    env_file: .env
    environment:
      - SYNC_REPLICA_PATH=/data/replica.db
      - SYNC_LITESTREAM_CONFIG=/etc/litestream.yml

  evidence:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "/entrypoint.sh"]
    ports:
      - "3000:3000"
    volumes:
      - ./evidence:/app
      - ./evidence-entrypoint.sh:/entrypoint.sh:ro
      - data:/data:ro
    environment:
      - EVIDENCE_SOURCE__analytics__filename=../../../data/replica.db

volumes:
  data:
